name: Deploy to Hetzner VPS

on:
  workflow_run:
    workflows: [publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Pull new image and restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: archon
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/archon
            docker compose --profile with-db --profile cloud pull
            docker compose --profile with-db --profile cloud up -d --remove-orphans
            docker image prune -af --filter "until=168h"
